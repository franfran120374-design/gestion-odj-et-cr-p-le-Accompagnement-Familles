function preambule(){
  return [{ id:"pre-mdt", titre:"Maître du temps + secrétaire de séance", duree:3,
    note:"Qui chronomètre ? Qui prend les notes pour le CR ?", fixe:true, categorie:"préambule" }];
}
function fmtKey(d){ return `${d.getFullYear()}_${String(d.getMonth()+1).padStart(2,"0")}_${String(d.getDate()).padStart(2,"0")}`; }
function fmtFr(d){ return d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}); }
function prochainJeudi(from=new Date()){ const d=new Date(from); const delta=(4-d.getDay()+7)%7||7; d.setDate(d.getDate()+delta); return d; }

/* ---- parsing CSV simple (Google Sheet publié) ---- */
function parseCSV(txt){
  const rows=[]; let cur=[],val="",q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){val+='"';i++;} else q=false; } else val+=c; }
    else { if(c==='"') q=true; else if(c===","){cur.push(val);val="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&txt[i+1]==="\n")i++; cur.push(val); rows.push(cur); cur=[]; val=""; } else val+=c; }
  }
  if(val!==""||cur.length){ cur.push(val); rows.push(cur); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}

function App(){
  const [mode,setMode]=useState("prep");
  const [dateKey,setDateKey]=useState(fmtKey(new Date()));
  const [store,setStore]=useState({});
  const [titre,setTitre]=useState("Réunion hebdomadaire — Pôle Accompagnement Famille");
  const [points,setPoints]=useState(preambule());
  const [questions,setQuestions]=useState([]);

  const [newTitre,setNewTitre]=useState(""); const [newDuree,setNewDuree]=useState(10); const [newNote,setNewNote]=useState("");
  const [qAuteur,setQAuteur]=useState(""); const [qTexte,setQTexte]=useState("");

  const [biblio,setBiblio]=useState(BIBLIOTHEQUE.map((b,i)=>({...b,bid:"b0-"+i})));
  const [selBiblio,setSelBiblio]=useState({}); // {bid:true}
  const [crTexte,setCrTexte]=useState(""); const [analyseEnCours,setAnalyseEnCours]=useState(false); const [analyseErr,setAnalyseErr]=useState("");
  const [archiveCR,setArchiveCR]=useState([]); // {id, nom, date, texte}
  const [importMsg,setImportMsg]=useState("");

  /* Google Sheet questions */
  const [sheetUrl,setSheetUrl]=useState("");
  const [chargementQ,setChargementQ]=useState(false); const [qErr,setQErr]=useState("");

  /* persistance localStorage — sans écrasement de l'ODJ en cours */
  const chargeInitial = useRef(false);
  const datePrecedente = useRef(dateKey);

  // 1) chargement initial unique
  useEffect(()=>{
    try{
      const raw=localStorage.getItem("efsf_odj");
      if(raw){
        const o=JSON.parse(raw);
        const s=o.store||{};
        setStore(s);
        if(o.sheetUrl) setSheetUrl(o.sheetUrl);
        if(Array.isArray(o.archiveCR)) setArchiveCR(o.archiveCR);
        const d=s[dateKey];
        if(d){ setTitre(d.titre); setPoints(d.points||preambule()); setQuestions(d.questions||[]); }
      }
    }catch(e){}
    chargeInitial.current=true;
  },[]);

  // 2) changement de date : on sauvegarde l'ancienne, on charge la nouvelle (ou préambule si neuve)
  useEffect(()=>{
    if(!chargeInitial.current) return;
    if(datePrecedente.current===dateKey) return; // pas un vrai changement
    const ancienne=datePrecedente.current;
    setStore(prev=>{
      const sauve={...prev,[ancienne]:{titre,points,questions}};
      const d=sauve[dateKey];
      if(d){ setTitre(d.titre); setPoints(d.points||preambule()); setQuestions(d.questions||[]); }
      else { setTitre("Réunion hebdomadaire — Pôle Accompagnement Famille"); setPoints(preambule()); setQuestions([]); }
      try{ localStorage.setItem("efsf_odj",JSON.stringify({store:sauve,sheetUrl,archiveCR})); }catch(e){}
      return sauve;
    });
    datePrecedente.current=dateKey;
  },[dateKey]);

  // 3) sauvegarde continue de la date courante (ne touche jamais aux autres dates ni au mode)
  useEffect(()=>{
    if(!chargeInitial.current) return;
    setStore(prev=>{
      const merged={...prev,[dateKey]:{titre,points,questions}};
      try{ localStorage.setItem("efsf_odj",JSON.stringify({store:merged,sheetUrl,archiveCR})); }catch(e){}
      return merged;
    });
  },[titre,points,questions,sheetUrl,archiveCR]);

  const totalDuree=useMemo(()=>points.reduce((s,p)=>s+(Number(p.duree)||0),0),[points]);
  const reste=TOTAL_CIBLE-totalDuree;

  function ajouterPoint(p){
    const item={ id:"p-"+Math.random().toString(36).slice(2,8), titre:p.titre, duree:Number(p.duree)||10,
      note:p.note||"", categorie:p.categorie||"fond", src:p.src };
    setPoints(prev=>{ const di=prev.findIndex(x=>x.categorie==="divers");
      if(di===-1) return [...prev,item]; const c=[...prev]; c.splice(di,0,item); return c; });
  }
  function supprimer(id){ setPoints(prev=>prev.filter(p=>p.id!==id)); }
  function maj(id,ch,v){ setPoints(prev=>prev.map(p=>p.id===id?{...p,[ch]:v}:p)); }
  function deplacer(id,dir){ setPoints(prev=>{ const i=prev.findIndex(p=>p.id===id); const j=i+dir;
    if(i<0||j<0||j>=prev.length) return prev; const c=[...prev]; [c[i],c[j]]=[c[j],c[i]]; return c; }); }
  function ajusterAuTotal(){
    const aj=points.filter(p=>!p.fixe); const sa=aj.reduce((s,p)=>s+(Number(p.duree)||0),0);
    const fixe=totalDuree-sa; const dispo=TOTAL_CIBLE-fixe; if(sa<=0||dispo<=0) return; const r=dispo/sa;
    setPoints(prev=>prev.map(p=>p.fixe?p:{...p,duree:Math.max(2,Math.round((Number(p.duree)||0)*r))}));
  }
  function ajouterDivers(){ if(points.some(p=>p.categorie==="divers")) return;
    ajouterPoint({titre:"Divers — questions libres",duree:10,note:"Sujets non prévus, annonces.",categorie:"divers"}); }
  function submitManuel(){ if(!newTitre.trim()) return;
    ajouterPoint({titre:newTitre.trim(),duree:newDuree,note:newNote.trim(),categorie:"fond"});
    setNewTitre(""); setNewDuree(10); setNewNote(""); }
  function submitQuestion(){ if(!qTexte.trim()) return;
    setQuestions(q=>[...q,{id:"q-"+Math.random().toString(36).slice(2,7),auteur:qAuteur.trim()||"Anonyme",texte:qTexte.trim()}]);
    setQAuteur(""); setQTexte(""); }

  function nouveauModele(d){
    const k=fmtKey(d);
    if(k===dateKey){ setMode("prep"); return; } // déjà sur cette date, rien à faire
    // la sauvegarde de la date courante est gérée par l'effet de changement de date
    setDateKey(k);
    setMode("prep");
  }

  const [saveMsg,setSaveMsg]=useState("");

  /* Sauvegarde EXPLICITE de la séance courante, avec horodatage et garde anti-écrasement */
  function sauvegarderSeance(){
    const maintenant=Date.now();
    setStore(prev=>{
      const existant=prev[dateKey];
      // anti-écrasement : si une version plus récente existe (rouverte ailleurs dans CE navigateur), on prévient
      // (le partage entre postes différents nécessitera Apps Script ; ici on protège la cohérence locale)
      const merged={...prev,[dateKey]:{titre,points,questions,maj:maintenant}};
      try{ localStorage.setItem("efsf_odj",JSON.stringify({store:merged,sheetUrl,archiveCR})); }catch(e){}
      return merged;
    });
    const d=dateKey.replace(/_/g,"/").split("/").reverse().join("/");
    setSaveMsg("Séance du "+d+" sauvegardée ✓");
    setTimeout(()=>setSaveMsg(""),3000);
  }

  /* Ouvrir une séance sauvegardée */
  function ouvrirSeance(k){
    if(!k||k===dateKey) return;
    // l'effet de changement de date sauvegarde l'ancienne et charge la nouvelle
    setDateKey(k);
    setMode("prep");
  }

  /* Supprimer une séance sauvegardée */
  function supprimerSeance(k){
    setStore(prev=>{
      const copie={...prev}; delete copie[k];
      try{ localStorage.setItem("efsf_odj",JSON.stringify({store:copie,sheetUrl,archiveCR})); }catch(e){}
      return copie;
    });
  }

  /* ---- Rafraîchir questions depuis Google Sheet ---- */
  /* Normalise un lien Google Sheet vers le vrai CSV publié */
  function normaliserLienCSV(u){
    u=u.trim();
    // déjà bon
    if(u.includes("output=csv")) return u;
    // page d'aperçu HTML publiée -> bascule en csv
    if(u.includes("/pubhtml")) return u.replace("/pubhtml","/pub").replace(/([?&])$/,"") + (u.includes("?")?"&":"?") + "output=csv";
    if(u.includes("/pub") && !u.includes("output=")) return u + (u.includes("?")?"&":"?") + "output=csv";
    // lien d'édition classique -> export csv
    const m=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if(m){ const gid=(u.match(/[?&#]gid=(\d+)/)||[])[1]; return "https://docs.google.com/spreadsheets/d/"+m[1]+"/export?format=csv"+(gid?("&gid="+gid):""); }
    return u;
  }

  function exploiterCSV(txt){
    // garde-fou : si on a reçu du HTML (page de login ou aperçu), on refuse
    const debut=txt.slice(0,200).toLowerCase();
    if(debut.includes("<!doctype")||debut.includes("<html")||debut.includes("<style")||debut.includes("servicelogin"))
      throw new Error("HTML_RECU");
    const rows=parseCSV(txt);
    if(rows.length<2) { setQErr("Le tableau est accessible mais vide (aucune réponse déposée pour l'instant)."); return false; }
    const head=rows[0].map(h=>h.toLowerCase());
    let iP=head.findIndex(h=>h.includes("prénom")||h.includes("prenom")||h.includes("nom")||h.includes("name"));
    let iQ=head.findIndex(h=>h.includes("question")||h.includes("point")||h.includes("sujet"));
    if(iQ===-1) iQ=rows[0].length-1;
    if(iP===-1) iP=Math.max(0,iQ-1);
    const nouvelles=rows.slice(1).map((r,k)=>({
      id:"gs-"+k, auteur:(r[iP]||"Anonyme").trim()||"Anonyme", texte:(r[iQ]||"").trim(), source:"sheet"
    })).filter(q=>q.texte);
    setQuestions(prev=>[...prev.filter(q=>q.source!=="sheet"),...nouvelles]);
    return true;
  }

  async function rafraichirQuestions(){
    if(!sheetUrl.trim()){ setQErr("Colle d'abord le lien CSV de ton Google Sheet ci-dessus."); return; }
    setChargementQ(true); setQErr("");
    const url=normaliserLienCSV(sheetUrl);
    // 1) tentative directe
    try{
      const res=await fetch(url,{redirect:"follow"});
      if(res.ok){ const txt=await res.text(); if(exploiterCSV(txt)!==false) {} setChargementQ(false); return; }
      throw new Error("HTTP "+res.status);
    }catch(e1){
      // 2) fallback proxy anti-CORS (sert le fichier avec les bons en-têtes)
      try{
        const proxy="https://corsproxy.io/?url="+encodeURIComponent(url);
        const res2=await fetch(proxy);
        if(!res2.ok) throw new Error("HTTP "+res2.status);
        const txt2=await res2.text();
        exploiterCSV(txt2);
      }catch(e2){
        if(String(e1.message).includes("HTML_RECU")||String(e2.message).includes("HTML_RECU")){
          setQErr("Le lien renvoie une page web, pas le fichier CSV. Va dans le Sheet → Fichier → Partager → Publier sur le web → format CSV, et recolle ce lien (il doit finir par output=csv).");
        } else {
          setQErr("Chargement impossible (Google bloque l'accès direct + le relais a échoué). Solution la plus fiable : ouvre le lien CSV dans un onglet, télécharge le fichier, ou recopie les questions à la main. Détail : "+e2.message);
        }
      } finally { setChargementQ(false); }
    }
  }

  /* ===== ARCHIVE DES CR ===== */
  function ajouterCRTexte(){
    if(!crTexte.trim()) return;
    const item={id:"cr-"+Date.now(), nom:"CR collé", date:new Date().toISOString().slice(0,10), texte:crTexte.trim()};
    setArchiveCR(prev=>[item,...prev]); setCrTexte(""); setImportMsg("CR ajouté à l'archive.");
    setTimeout(()=>setImportMsg(""),2500);
  }
  async function importerDocx(file){
    if(!file) return;
    setImportMsg("Lecture du fichier…");
    try{
      const buf=await file.arrayBuffer();
      const r=await window.mammoth.extractRawText({arrayBuffer:buf});
      const texte=(r.value||"").trim();
      if(!texte){ setImportMsg("Fichier vide ou illisible."); return; }
      // tente d'extraire une date AAAA_MM_JJ ou JJ/MM/AAAA du nom
      let date=new Date().toISOString().slice(0,10);
      const m1=file.name.match(/(20\d{2})[_-](\d{2})[_-](\d{2})/);
      if(m1) date=m1[1]+"-"+m1[2]+"-"+m1[3];
      const item={id:"cr-"+Date.now(), nom:file.name, date, texte};
      setArchiveCR(prev=>[item,...prev]);
      setImportMsg("« "+file.name+" » importé ("+texte.length+" caractères).");
      setTimeout(()=>setImportMsg(""),3000);
    }catch(e){ setImportMsg("Échec de lecture du .docx : "+e.message); }
  }
  function supprimerCR(id){ setArchiveCR(prev=>prev.filter(c=>c.id!==id)); }

  /* Extraction LOCALE sans IA : repère les lignes ressemblant à des actions à reprendre */
  function extractionLocale(){
    if(!archiveCR.length){ setAnalyseErr("Ajoute d'abord au moins un CR dans l'archive ci-dessous."); return; }
    const motsCles=/(à faire|a faire|à prévoir|a prevoir|reporté|reporte|à revoir|a revoir|relancer|relance|à suivre|a suivre|suivi|à confirmer|a confirmer|prochaine réunion|semaine prochaine|voir avec|à contacter|a contacter|recontacter|en attente|à finaliser|a finaliser|à valider|a valider|à organiser|a organiser|à compléter|a completer|todo|action|à envoyer|a envoyer|à planifier|a planifier|objectif|deadline|échéance|echeance)/i;
    const trouve=[];
    const vus=new Set();
    archiveCR.forEach(cr=>{
      cr.texte.split(/\n|(?<=\.)\s+/).forEach(ligne=>{
        const l=ligne.trim();
        if(l.length<12||l.length>200) return;
        if(/^(légende|legende|date|lieu|présents|presents|rédigé|redige|personnes présentes)/i.test(l)) return;
        if(motsCles.test(l)){
          const cle=l.toLowerCase().replace(/[^a-zà-ÿ0-9]/g,"").slice(0,40);
          if(vus.has(cle)) return; vus.add(cle);
          trouve.push({t:l.slice(0,90), d:10, note:l, src:"extrait local · "+cr.date});
        }
      });
    });
    if(!trouve.length){ setAnalyseErr("Aucune action évidente détectée. Tu peux ajouter les points à la main ou utiliser l'analyse IA dans Claude.ai."); return; }
    setAnalyseErr("");
    setBiblio(prev=>[...trouve.slice(0,20).map((t,i)=>({...t,bid:"bl-"+Date.now()+"-"+i})),...prev]);
    setImportMsg(trouve.length+" point(s) extraits et ajoutés à la liste « Points en attente ».");
    setTimeout(()=>setImportMsg(""),4000);
  }

  /* ---- Analyse IA multi-CR (uniquement dans Claude.ai) ---- */
  async function analyserCR(){
    // si rien dans le champ mais archive présente, analyse toute l'archive
    const source = crTexte.trim() ? crTexte : archiveCR.map(c=>"=== CR "+c.date+" ("+c.nom+") ===\n"+c.texte).join("\n\n");
    if(!source.trim()) return;
    setAnalyseEnCours(true); setAnalyseErr("");
    try{
      const prompt="Tu es l'assistant du Pôle Accompagnement Famille de En Faim Sans Fil (EFSF). "+
        "Voici un ou PLUSIEURS comptes-rendus de réunion (séparés par des lignes de tirets ou des dates). "+
        "Identifie UNIQUEMENT les points à REPRENDRE en prochaine réunion : actions non terminées, sujets reportés, "+
        "décisions en attente, suivis, échéances futures. Ignore le clos. "+
        "DÉDOUBLONNE : si un même sujet revient dans plusieurs CR, fusionne-le en un seul point. "+
        "Pour chaque point propose une durée réaliste (5 à 20 min, total réunion 60 min). "+
        "Réponds STRICTEMENT en JSON sans texte ni Markdown : "+
        '[{"t":"intitulé","d":10,"note":"détail / action / qui","src":"reporté"}]. Max 12 points. CR :\n\n'+source.slice(0,16000);
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:prompt}]})
      });
      const data=await res.json();
      const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").replace(/```json|```/g,"").trim();
      const parsed=JSON.parse(txt);
      const nett=parsed.filter(p=>p&&p.t).map(p=>({t:String(p.t).slice(0,90),d:Math.min(20,Math.max(5,Number(p.d)||10)),note:String(p.note||""),src:p.src?("IA · "+p.src):"IA · CR collé"}));
      setBiblio(prev=>[...nett.map((n,i)=>({...n,bid:"bi-"+Date.now()+"-"+i})),...prev]); setCrTexte("");
    }catch(e){ setAnalyseErr("Analyse échouée (réponse non exploitable). Réessaie ou ajoute les points à la main."); }
    finally{ setAnalyseEnCours(false); }
  }

          <input value={titre} onChange={e=>setTitre(e.target.value)} style={{...inp("100%"),fontWeight:600,marginBottom:12}}/>
          <BarreTemps total={totalDuree} reste={reste} ajuster={ajusterAuTotal}/>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:12}}>
            {points.map((pt,i)=><LignePoint key={pt.id} p={pt} index={i} maj={maj} supprimer={supprimer} deplacer={deplacer}/>)}
          </div>
          {!points.some(x=>x.categorie==="divers") &&
            <button onClick={ajouterDivers} style={{...btn(C.vert),marginTop:12}}>+ Ajouter le point « Divers » (clôture 10 min)</button>}
        </Carte>

        <Carte couleur={C.orange} titre="Ajouter un point manuel">
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <input placeholder="Intitulé du point" value={newTitre} onChange={e=>setNewTitre(e.target.value)} style={inp("100%")}/>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <label style={{fontSize:13}}>Durée</label>
              <input type="number" min={2} max={45} value={newDuree} onChange={e=>setNewDuree(Number(e.target.value))} style={inp(70)}/>
              <span style={{fontSize:13}}>min</span>
            </div>
            <textarea placeholder="Note / détail (optionnel)" value={newNote} onChange={e=>setNewNote(e.target.value)} style={{...inp("100%"),height:54,resize:"vertical"}}/>
            <button onClick={submitManuel} style={btn(C.orange)}>+ Ajouter à l'ODJ</button>
          </div>
        </Carte>

        <Carte couleur={C.corail} titre="Questions des bénévoles">
          <div style={{background:C.bleuPale,borderRadius:10,padding:"10px 12px",marginBottom:12}}>
            <div style={{fontSize:12,color:C.ink,marginBottom:6,fontWeight:600}}>📥 Questions déposées à distance (Google Form)</div>
            <input placeholder="Lien CSV publié du Google Sheet…" value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)} style={{...inp("100%"),marginBottom:6}}/>
            <button onClick={rafraichirQuestions} disabled={chargementQ} style={{...btn(C.bleu),width:"100%",opacity:chargementQ?0.6:1}}>
              {chargementQ?"Chargement…":"🔄 Rafraîchir les questions des bénévoles"}
            </button>
            <button onClick={()=>setQuestions(prev=>prev.filter(q=>q.source!=="sheet"))} style={{...btn(C.orange),width:"100%",marginTop:6,fontSize:12}}>
              🧹 Vider les questions importées
            </button>
            {qErr && <div style={{fontSize:12,color:C.corail,marginTop:6}}>{qErr}</div>}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <input placeholder="Prénom" value={qAuteur} onChange={e=>setQAuteur(e.target.value)} style={inp(110)}/>
            <input placeholder="Ajouter une question manuellement" value={qTexte} onChange={e=>setQTexte(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submitQuestion()} style={inp("100%")}/>
            <button onClick={submitQuestion} style={btn(C.corail)}>+</button>
          </div>
          {questions.length===0 ?
            <div style={{fontSize:13,color:"#888"}}>Aucune question pour le moment.</div> :
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {questions.map(q=>(
                <div key={q.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:q.source==="sheet"?C.bleuPale:C.coraiPale,borderRadius:8,padding:"6px 10px",fontSize:13}}>
                  <span><b style={{color:q.source==="sheet"?C.bleu:C.corail}}>{q.auteur} :</b> {q.texte} {q.source==="sheet"&&<span style={{fontSize:10,color:C.bleu}}>📥</span>}</span>
                  <button onClick={()=>setQuestions(arr=>arr.filter(x=>x.id!==q.id))} style={miniBtn}>✕</button>
                </div>
              ))}
            </div>}
        </Carte>
      </div>

      <div className="sticky-col" style={{position:"sticky",top:8}}>
        <Carte couleur={C.bleu} titre="📚 Archive des comptes-rendus">
          <div style={{fontSize:12,color:"#777",marginBottom:8}}>Ajoute tes CR au fur et à mesure. Ils sont conservés et servent à extraire les points à reprendre.</div>
          <textarea placeholder="Colle ici le texte d'un CR…" value={crTexte} onChange={e=>setCrTexte(e.target.value)} style={{...inp("100%"),height:70,resize:"vertical"}}/>
          <div style={{display:"flex",gap:6,marginTop:6}}>
            <button onClick={ajouterCRTexte} disabled={!crTexte.trim()} style={{...btn(C.bleu),flex:1,opacity:crTexte.trim()?1:0.6}}>+ Ajouter ce texte</button>
            <label style={{...btn(C.vert),flex:1,textAlign:"center",cursor:"pointer"}}>
              📎 Importer .docx
              <input type="file" accept=".docx" style={{display:"none"}} onChange={e=>{importerDocx(e.target.files[0]); e.target.value="";}}/>
            </label>
          </div>
          {importMsg && <div style={{fontSize:12,color:C.vert,marginTop:6,fontWeight:600}}>{importMsg}</div>}

          {archiveCR.length>0 && <div style={{marginTop:10,maxHeight:120,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
            {archiveCR.map(cr=>(
              <div key={cr.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.bleuPale,borderRadius:8,padding:"4px 8px",fontSize:12}}>
                <span>📄 {cr.date} · {cr.nom.slice(0,28)}</span>
                <button onClick={()=>supprimerCR(cr.id)} style={miniBtn}>✕</button>
              </div>
            ))}
          </div>}

          <div style={{borderTop:"1px solid #E3EEF3",marginTop:10,paddingTop:10}}>
            <button onClick={extractionLocale} disabled={!archiveCR.length} style={{...btn(C.orange),width:"100%",opacity:archiveCR.length?1:0.6}}>
              🔎 Extraire les points à reprendre {archiveCR.length>0 && "("+archiveCR.length+" CR)"}
            </button>
            <div style={{fontSize:11,color:"#999",marginTop:4}}>Repère automatiquement les actions, suivis et reports (sans IA, fonctionne partout).</div>
            {IA_DISPONIBLE && <button onClick={analyserCR} disabled={analyseEnCours||(!crTexte.trim()&&!archiveCR.length)} style={{...btn(C.bleu),width:"100%",marginTop:6,opacity:(analyseEnCours||(!crTexte.trim()&&!archiveCR.length))?0.6:1}}>
              {analyseEnCours?"Analyse IA en cours…":"🤖 Analyse IA fine (dédoublonne + durées)"}
            </button>}
            {!IA_DISPONIBLE && <div style={{fontSize:11,color:"#888",marginTop:6,lineHeight:1.4}}>ℹ️ L'analyse IA fine n'est dispo que dans Claude.ai. Ici, l'extraction locale ci-dessus prend le relais.</div>}
            {analyseErr && <div style={{fontSize:12,color:C.corail,marginTop:6}}>{analyseErr}</div>}
          </div>
        </Carte>

        <Carte couleur={C.vert} titre="Points en attente">
          <div style={{fontSize:12,color:"#777",marginBottom:8}}>Pré-remplis depuis vos CR (21 mai → 11 juin){IA_DISPONIBLE?" + extraits IA":""}. Cliquez le texte pour ajouter à l'ODJ, ou cochez pour supprimer les points traités.</div>
          {(()=>{ const nbSel=Object.values(selBiblio).filter(Boolean).length; return (
            <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
              <button onClick={()=>{ const all={}; biblio.forEach(b=>all[b.bid]=true); setSelBiblio(all); }} style={{...btn(C.bleu),fontSize:11,padding:"5px 10px"}}>Tout cocher</button>
              <button onClick={()=>setSelBiblio({})} style={{...btn(C.vert),fontSize:11,padding:"5px 10px"}}>Tout décocher</button>
              <button onClick={()=>{ setBiblio(prev=>prev.filter(b=>!selBiblio[b.bid])); setSelBiblio({}); }} disabled={nbSel===0}
                style={{...btn(C.corail),fontSize:11,padding:"5px 10px",opacity:nbSel===0?0.5:1}}>🗑 Supprimer la sélection{nbSel>0?" ("+nbSel+")":""}</button>
            </div>
          ); })()}
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:420,overflowY:"auto",paddingRight:4}}>
            {biblio.length===0 && <div style={{fontSize:12,color:"#999",fontStyle:"italic"}}>Liste vide. Ajoute des CR puis « Extraire les points », ou saisis un point manuel.</div>}
            {biblio.map((b)=>(
              <div key={b.bid} style={{display:"flex",alignItems:"flex-start",gap:8,background:selBiblio[b.bid]?C.coraiPale:C.vertPale,border:"1px solid "+(selBiblio[b.bid]?C.corail:C.vert),borderRadius:10,padding:"8px 10px"}}>
                <input type="checkbox" checked={!!selBiblio[b.bid]} onChange={e=>setSelBiblio(s=>({...s,[b.bid]:e.target.checked}))} style={{marginTop:3,cursor:"pointer"}}/>
                <button onClick={()=>ajouterPoint({titre:b.t,duree:b.d,note:b.note,src:b.src,categorie:"fond"})}
                  style={{textAlign:"left",background:"transparent",border:"none",cursor:"pointer",flex:1,padding:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:C.ink}}>{b.t} <span style={{color:C.orange}}>· {b.d}'</span></div>
                  <div style={{fontSize:11,color:"#888"}}>{b.src}</div>
                </button>
                <button onClick={()=>setBiblio(prev=>prev.filter(x=>x.bid!==b.bid))} style={miniBtn} title="Retirer ce point">✕</button>
              </div>
            ))}
          </div>
        </Carte>
      </div>
    </div>
  );
}

function BarreTemps({total,reste,ajuster}){
  const pct=Math.min(100,Math.round((total/TOTAL_CIBLE)*100));
  const dep=total>TOTAL_CIBLE; const couleur=dep?C.corail:total>=TOTAL_CIBLE-5?C.orange:C.vert;
  return (
    <div style={{background:"#F7FBFD",border:"1px solid "+C.bleu,borderRadius:12,padding:"10px 12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
        <span style={{fontSize:13,fontWeight:600,color:C.ink}}>Total : {total} / {TOTAL_CIBLE} min</span>
        <span style={{fontSize:13,fontWeight:700,color:couleur}}>{dep?("Dépassement de "+(-reste)+" min"):(reste+" min restantes")}</span>
      </div>
      <div style={{height:10,background:"#E3EEF3",borderRadius:6,marginTop:6,overflow:"hidden"}}>
        <div style={{width:pct+"%",height:"100%",background:couleur,transition:"width .3s"}}/>
      </div>
      <button onClick={ajuster} style={{...btn(C.bleu),marginTop:8,fontSize:12}}>⚖ Ajuster automatiquement les durées sur 60 min</button>
    </div>
  );
}

function LignePoint({p,index,maj,supprimer,deplacer}){
  const cc=p.categorie==="préambule"?C.bleu:p.categorie==="divers"?C.corail:C.orange;
  return (
    <div style={{display:"flex",gap:8,alignItems:"flex-start",background:"#fff",border:"1px solid #E3EEF3",borderLeft:"4px solid "+cc,borderRadius:10,padding:"8px 10px"}}>
      <div style={{display:"flex",flexDirection:"column",gap:2,paddingTop:2}}>
        <button onClick={()=>deplacer(p.id,-1)} style={miniBtn}>▲</button>
        <button onClick={()=>deplacer(p.id,1)} style={miniBtn}>▼</button>
      </div>
      <div style={{flex:1}}>
        <input value={p.titre} onChange={e=>maj(p.id,"titre",e.target.value)} style={{...inp("100%"),fontWeight:600,border:"none",padding:"2px 0",color:C.ink}}/>
        <textarea value={p.note} onChange={e=>maj(p.id,"note",e.target.value)} placeholder="note…" style={{width:"100%",border:"none",fontSize:12,color:"#777",resize:"vertical",height:p.note?"auto":22,fontFamily:"inherit",background:"transparent"}}/>
        {p.src && <span style={{fontSize:11,color:C.vert}}>↪ {p.src}</span>}
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <input type="number" min={2} max={45} value={p.duree} onChange={e=>maj(p.id,"duree",Number(e.target.value))} style={inp(56)} disabled={p.fixe}/>
          <span style={{fontSize:12}}>min</span>
        </div>
        {!p.fixe && <button onClick={()=>supprimer(p.id)} style={miniBtn}>🗑</button>}
      </div>
    </div>
  );
}

function Seance({points,titre,dateKey,totalDuree}){
  const [idx,setIdx]=useState(0); const [running,setRunning]=useState(false);
  const [elapsed,setElapsed]=useState(0); const [totalElapsed,setTotalElapsed]=useState(0);
  const tick=useRef(null);
  useEffect(()=>{ if(running){ tick.current=setInterval(()=>{setElapsed(e=>e+1);setTotalElapsed(t=>t+1);},1000); }
    return ()=>clearInterval(tick.current); },[running]);
  if(!points.length) return <Carte couleur={C.orange} titre="Séance"><div>Aucun point. Préparez d'abord l'ODJ.</div></Carte>;
  const p=points[idx]; const limite=(Number(p.duree)||0)*60; const restant=limite-elapsed; const dep=restant<0;
  const pct=Math.min(100,(elapsed/limite)*100);
  const mmss=s=>{const sg=s<0?"-":"";const a=Math.abs(s);return sg+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");};
  return (
    <div>
      <Carte couleur={dep?C.corail:C.bleu} titre={"Point "+idx+" / "+(points.length-1)}>
        <div style={{textAlign:"center",padding:"8px 0"}}>
          <div style={{fontSize:13,color:C.orange,fontWeight:600}}>{p.categorie==="préambule"?"Préambule":p.categorie==="divers"?"Divers":("Point "+idx)} · prévu {p.duree} min</div>
          <div style={{fontSize:24,fontWeight:700,color:C.ink,margin:"6px 0 12px"}}>{p.titre}</div>
          {p.note && <div style={{fontSize:13,color:"#777",maxWidth:600,margin:"0 auto 14px"}}>{p.note}</div>}
          <div style={{fontSize:64,fontWeight:800,fontVariantNumeric:"tabular-nums",color:dep?C.corail:C.ink,lineHeight:1}}>{mmss(restant)}</div>
          <div style={{fontSize:13,color:dep?C.corail:"#999",marginTop:4}}>{dep?"⚠ Temps dépassé":"temps restant sur ce point"}</div>
          <div style={{height:10,background:"#E3EEF3",borderRadius:6,margin:"14px auto",maxWidth:480,overflow:"hidden"}}>
            <div style={{width:pct+"%",height:"100%",background:dep?C.corail:pct>80?C.orange:C.vert,transition:"width 1s linear"}}/>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",marginTop:8}}>
            <button onClick={()=>setRunning(r=>!r)} style={btn(running?C.orange:C.vert)}>{running?"⏸ Pause":"▶ Démarrer"}</button>
            <button onClick={()=>setElapsed(0)} style={btn(C.bleu)}>↺ Reset point</button>
            <button onClick={()=>{if(idx>0){setIdx(idx-1);setElapsed(0);}}} style={btn(C.bleu)} disabled={idx===0}>← Précédent</button>
            <button onClick={()=>{if(idx<points.length-1){setIdx(idx+1);setElapsed(0);}}} style={btn(C.corail)} disabled={idx===points.length-1}>Suivant →</button>
          </div>
        </div>
      </Carte>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",border:"1px solid "+C.bleu,borderRadius:12,padding:"10px 14px",marginTop:12}}>
        <span style={{fontSize:13,color:C.ink}}>⏱ Total écoulé : <b>{mmss(totalElapsed)}</b> / prévu {totalDuree} min</span>
        <span style={{fontSize:13,color:totalElapsed>totalDuree*60?C.corail:C.vert,fontWeight:600}}>{totalElapsed>totalDuree*60?"Réunion en dépassement":"Dans les temps"}</span>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:12}}>
        {points.map((pt,i)=>(
          <button key={pt.id} onClick={()=>{setIdx(i);setElapsed(0);}}
            style={{fontSize:12,padding:"4px 10px",borderRadius:8,border:"1px solid "+(i===idx?C.corail:"#D9E7EE"),background:i===idx?C.coraiPale:"#fff",cursor:"pointer",color:C.ink}}>
            {i}. {pt.titre.slice(0,22)}{pt.titre.length>22?"…":""} <span style={{color:C.orange}}>{pt.duree}'</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function Carte({couleur,titre,children}){
  return (
    <div style={{background:"#fff",borderRadius:16,border:"1px solid "+couleur,marginBottom:16,overflow:"hidden"}}>
      <div style={{background:couleur,color:"#fff",fontWeight:700,fontSize:15,padding:"8px 16px"}}>{titre}</div>
      <div style={{padding:16}}>{children}</div>
    </div>
  );
}
function Onglet({actif,onClick,couleur,label}){
  return <button onClick={onClick} style={{padding:"8px 16px",borderRadius:10,fontWeight:700,fontSize:14,cursor:"pointer",border:"2px solid "+couleur,background:actif?couleur:"#fff",color:actif?"#fff":couleur}}>{label}</button>;
}
const inp=w=>({width:w,padding:"8px 10px",borderRadius:8,border:"1px solid #CFE3EC",fontSize:13,fontFamily:"inherit",color:C.text,boxSizing:"border-box"});
const btn=c=>({padding:"8px 14px",borderRadius:10,border:"none",background:c,color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"});
const miniBtn={border:"none",background:"transparent",cursor:"pointer",fontSize:12,color:"#999",padding:2};

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="max-width:700px;margin:40px auto;padding:24px;border:2px solid #FF686D;border-radius:16px;font-family:Montserrat,sans-serif;color:#333">'+
    '<h2 style="color:#FF686D">Oups, un souci au démarrage</h2>'+
    '<p>Recharge la page (Ctrl+R / Cmd+R). Si le problème persiste, vérifie ta connexion internet : l\'outil a besoin de charger quelques librairies en ligne.</p>'+
    '<pre style="background:#FFEDED;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px">'+(err && err.message ? err.message : err)+'</pre></div>';
}
</script>
<script>
/* Chargeur : compile le source JSX en runtime CLASSIC (évite les import ES auto de Babel) */
(function(){
  function demarrer(){
    try{
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]]
      }).code;
      // exécute dans le scope global (React / ReactDOM déjà chargés)
      (0, eval)(out);
    }catch(err){
      var r = document.getElementById("root");
      if(r) r.innerHTML =
        '<div style="max-width:700px;margin:40px auto;padding:24px;border:2px solid #FF686D;border-radius:16px;font-family:sans-serif;color:#333">'+
        '<h2 style="color:#FF686D">Oups, un souci au démarrage</h2>'+
        '<p>Recharge la page (Ctrl+R / Cmd+R). Vérifie ta connexion internet.</p>'+
        '<pre style="background:#FFEDED;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px">'+(err && err.message ? err.message : err)+'</pre></div>';
      console.error(err);
    }
  }
  if (window.Babel && window.React && window.ReactDOM) demarrer();
  else window.addEventListener("load", demarrer);
})();
</script>
</body>
